name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DEMO_PROJECT: 'SuperUI.Demo/SuperUI.Demo.csproj'
  REPO_NAME: 'SuperUI.Blazor'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore ${{ env.DEMO_PROJECT }}

      - name: Publish Blazor WASM
        run: dotnet publish ${{ env.DEMO_PROJECT }} -c Release -o publish --nologo

      - name: Rewrite base href for project pages
        run: |
          sed -i 's|<base href="/" />|<base href="/${{ env.REPO_NAME }}/" />|g' publish/wwwroot/index.html

      - name: Copy index.html to 404.html (SPA fallback)
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Remove pre-compressed assets (GitHub Pages cannot serve .br/.gz)
        run: |
          find publish/wwwroot -type f \( -name '*.br' -o -name '*.gz' \) -delete

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify CSS and JS (excl. Blazor framework)
        shell: bash
        run: |
          npm install -g csso-cli terser 2>/dev/null

          while IFS= read -r file; do
            echo "CSS  $file"
            csso -i "$file" -o "$file" --comments none
          done < <(find publish/wwwroot -name '*.css' -not -path '*/_framework/*')

          while IFS= read -r file; do
            echo "JS   $file"
            terser "$file" -o "$file" -c passes=2 -m toplevel
          done < <(find publish/wwwroot -name '*.js' -not -path '*/_framework/*')

      # - name: Prerender static HTML for crawlers
      #   run: node prerender.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
