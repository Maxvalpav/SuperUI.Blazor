name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch   # 1.0.0 -> 1.0.1
          - minor   # 1.0.0 -> 1.1.0
          - major   # 1.0.0 -> 2.0.0

env:
  DOTNET_VERSION: '10.0.x'
  PROJECT_PATH: 'SuperUI/SuperUI.csproj'
  CONFIGURATION: 'Release'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: nuget

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Get latest tag
        id: latest
        run: |
          TAG=$(git tag --list 'v*' --sort=-v:refname | sed -n '1p')
          if [ -z "$TAG" ]; then
            echo "version=1.0.0" >> $GITHUB_OUTPUT
          else
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        id: bump
        run: |
          IFS='.' read -ra PARTS <<< "${{ steps.latest.outputs.version }}"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            *)     PATCH=$((PATCH+1)) ;;
          esac
          NEW="v$MAJOR.$MINOR.$PATCH"
          echo "tag=$NEW" >> $GITHUB_OUTPUT
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Update csproj version
        run: |
          sed -i 's|<Version>[^<]*</Version>|<Version>${{ steps.bump.outputs.version }}</Version>|' ${{ env.PROJECT_PATH }}
          sed -i 's|<PackageReleaseNotes>[^<]*</PackageReleaseNotes>|<PackageReleaseNotes>${{ steps.bump.outputs.version }} — see https://github.com/Maxvalpav/SuperUI.Blazor/releases/tag/${{ steps.bump.outputs.tag }}</PackageReleaseNotes>|' ${{ env.PROJECT_PATH }}

      - name: Commit version bump
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ${{ env.PROJECT_PATH }}
          git commit -m "Bump version to ${{ steps.bump.outputs.version }}"

      - name: Create tag
        run: |
          git tag ${{ steps.bump.outputs.tag }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Minify CSS and JS (excl. Blazor framework)
        shell: bash
        run: |
          npm install -g csso-cli terser 2>/dev/null

          while IFS= read -r file; do
            echo "CSS  $file"
            csso -i "$file" -o "$file" --comments none
          done < <(find . -path '*/wwwroot/*.css' -not -path '*/_framework/*')

          while IFS= read -r file; do
            echo "JS   $file"
            terser "$file" -o "$file" -c passes=2 -m toplevel
          done < <(find . -path '*/wwwroot/*.js' -not -path '*/_framework/*')

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration ${{ env.CONFIGURATION }} --no-build --output ./artifacts

      - name: Push commit and tag
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin ${{ steps.bump.outputs.tag }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          generate_release_notes: true
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
