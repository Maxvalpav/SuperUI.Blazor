<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
    <!-- Rubik's Cube Style Logo (3x3 Grid) -->
    <defs>
        <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.5" result="blur"/>
            <feOffset dx="0.5" dy="0.5"/>
            <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadow"/>
            <feFlood flood-color="black" flood-opacity="0.2"/>
            <feComposite in2="shadow" operator="in"/>
            <feComposite in2="SourceGraphic" operator="over"/>
        </filter>
    </defs>

    <!-- Row 1 -->
    <rect x="2" y="2" width="8" height="8" rx="1.5" fill="#0078d4" filter="url(#innerShadow)"/>
    <rect x="12" y="2" width="8" height="8" rx="1.5" fill="#106ebe" filter="url(#innerShadow)"/>
    <rect x="22" y="2" width="8" height="8" rx="1.5" fill="#005a9e" filter="url(#innerShadow)"/>

    <!-- Row 2 (Letters S, U, I) -->
    <rect x="2" y="12" width="8" height="8" rx="1.5" fill="#106ebe" filter="url(#innerShadow)"/>
    <text x="6" y="18.5" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="900" fill="white" text-anchor="middle">S</text>
    
    <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#0078d4" filter="url(#innerShadow)"/>
    <text x="16" y="18.5" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="900" fill="white" text-anchor="middle">U</text>
    
    <rect x="22" y="12" width="8" height="8" rx="1.5" fill="#106ebe" filter="url(#innerShadow)"/>
    <text x="26" y="18.5" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="900" fill="white" text-anchor="middle">I</text>

    <!-- Row 3 -->
    <rect x="2" y="22" width="8" height="8" rx="1.5" fill="#005a9e" filter="url(#innerShadow)"/>
    <rect x="12" y="22" width="8" height="8" rx="1.5" fill="#106ebe" filter="url(#innerShadow)"/>
    <rect x="22" y="22" width="8" height="8" rx="1.5" fill="#0078d4" filter="url(#innerShadow)"/>
</svg>
